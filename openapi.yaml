openapi: 3.1.0
x-rtk-spec:
  id: SPEC-BILLING-OPENAPI
  status: normative
  owner: rtk_billing
info:
  title: RTK Billing API
  version: 1.0.0
  description: Provider-neutral pricing, wallet, payment, invoice, and billing access
    service.
paths:
  /v1/internal/billing/clouds/{orgId}/ownership-handoffs/{operationId}/prepare:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
      - { $ref: '#/components/parameters/HandoffOperationId' }
      - { $ref: '#/components/parameters/HandoffOwnershipVersion' }
    post:
      tags: [Ownership Handoff]
      operationId: prepareBillingOwnershipHandoff
      security:
      - billingHandoffAuth: []
      x-rtk-feature-id: FEAT-CONTRACT-MULTICLOUD-001
      x-rtk-requirement-ids: [REQ-MULTICLOUD-HANDOFF-001]
      summary: Install the durable monetary hold; does not certify settlement.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandoffPrepareRequest' }
      responses:
        '200':
          description: Scope-bound durable result. HTTP delivery never proves producer drain or owner commit.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoffPrepareResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/internal/billing/clouds/{orgId}/ownership-handoffs/{operationId}/settlement:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
      - { $ref: '#/components/parameters/HandoffOperationId' }
      - { $ref: '#/components/parameters/HandoffOwnershipVersion' }
    get:
      tags: [Ownership Handoff]
      operationId: getBillingOwnershipSettlement
      security:
      - billingHandoffAuth: []
      x-rtk-feature-id: FEAT-CONTRACT-MULTICLOUD-001
      x-rtk-requirement-ids: [REQ-MULTICLOUD-HANDOFF-001]
      summary: Read live settlement validity, minimal snapshot and blockers.
      responses:
        '200':
          description: Scope-bound durable result. HTTP delivery never proves producer drain or owner commit.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoffSettlementResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/internal/billing/clouds/{orgId}/ownership-handoffs/{operationId}/confirm:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
      - { $ref: '#/components/parameters/HandoffOperationId' }
      - { $ref: '#/components/parameters/HandoffOwnershipVersion' }
    post:
      tags: [Ownership Handoff]
      operationId: confirmBillingOwnershipSnapshot
      security:
      - billingHandoffAuth: []
      x-rtk-feature-id: FEAT-CONTRACT-MULTICLOUD-001
      x-rtk-requirement-ids: [REQ-MULTICLOUD-HANDOFF-001]
      summary: Confirm an exact snapshot as a coordinator-authenticated participant.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandoffConfirmRequest' }
      responses:
        '200':
          description: Scope-bound durable result. HTTP delivery never proves producer drain or owner commit.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoffSettlementResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/internal/billing/clouds/{orgId}/ownership-handoffs/{operationId}/authorize-commit:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
      - { $ref: '#/components/parameters/HandoffOperationId' }
      - { $ref: '#/components/parameters/HandoffOwnershipVersion' }
    post:
      tags: [Ownership Handoff]
      operationId: authorizeBillingOwnershipCommit
      security:
      - billingHandoffAuth: []
      x-rtk-feature-id: FEAT-CONTRACT-MULTICLOUD-001
      x-rtk-requirement-ids: [REQ-MULTICLOUD-HANDOFF-001]
      summary: Issue a persisted grant only after current settlement and both confirmations.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandoffAuthorizeRequest' }
      responses:
        '200':
          description: Scope-bound durable result. HTTP delivery never proves producer drain or owner commit.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoffAuthorizationResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/internal/billing/clouds/{orgId}/ownership-handoffs/{operationId}/finalize:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
      - { $ref: '#/components/parameters/HandoffOperationId' }
      - { $ref: '#/components/parameters/HandoffOwnershipVersion' }
    post:
      tags: [Ownership Handoff]
      operationId: finalizeBillingOwnershipHandoff
      security:
      - billingHandoffAuth: []
      x-rtk-feature-id: FEAT-CONTRACT-MULTICLOUD-001
      x-rtk-requirement-ids: [REQ-MULTICLOUD-HANDOFF-001]
      summary: Apply a verified durable Account Manager commit; retry forward only.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandoffFinalizeRequest' }
      responses:
        '200':
          description: Scope-bound durable result. HTTP delivery never proves producer drain or owner commit.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoffProtocolResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/internal/billing/clouds/{orgId}/ownership-handoffs/{operationId}/abort:
    parameters:
      - { $ref: '#/components/parameters/OrgId' }
      - { $ref: '#/components/parameters/HandoffOperationId' }
      - { $ref: '#/components/parameters/HandoffOwnershipVersion' }
    post:
      tags: [Ownership Handoff]
      operationId: beginBillingOwnershipAbort
      security:
      - billingHandoffAuth: []
      x-rtk-feature-id: FEAT-CONTRACT-MULTICLOUD-001
      x-rtk-requirement-ids: [REQ-MULTICLOUD-HANDOFF-001]
      summary: Record a verified precommit cancellation; does not certify hold release.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HandoffAbortRequest' }
      responses:
        '200':
          description: Scope-bound durable result. HTTP delivery never proves producer drain or owner commit.
          headers:
            Cache-Control: { schema: { type: string, const: no-store } }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HandoffProtocolResponse' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Error' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409': { $ref: '#/components/responses/Error' }
        '503': { $ref: '#/components/responses/Error' }
  /v1/internal/billing/pricing-versions:
    post:
      tags:
      - Internal Billing
      summary: Create a draft pricing version and immutable rate set
      operationId: createBillingPricingVersion
      security:
      - billingInternalAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '201':
          description: Pricing version created.
        '409':
          $ref: '#/components/responses/Error'
      x-rtk-feature-id: FEAT-AM-INVOICE-001
      x-rtk-requirement-ids:
      - REQ-AM-PRICING-VERSION-001
  /v1/internal/billing/pricing-versions/{pricingVersionId}/activate:
    post:
      tags:
      - Internal Billing
      summary: Activate one pricing version and retire the prior version
      operationId: activateBillingPricingVersion
      security:
      - billingInternalAuth: []
      parameters:
      - name: pricingVersionId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Pricing version activated.
        '404':
          $ref: '#/components/responses/Error'
      x-rtk-feature-id: FEAT-AM-INVOICE-001
      x-rtk-requirement-ids:
      - REQ-AM-PRICING-VERSION-001
  /v1/internal/billing/usage-facts:
    post:
      tags:
      - Internal Billing
      summary: Idempotently ingest a digest-anchored usage fact
      operationId: putBillingUsageFact
      security:
      - billingInternalAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Existing identical fact.
        '201':
          description: Usage fact created.
        '409':
          $ref: '#/components/responses/Error'
      x-rtk-feature-id: FEAT-AM-INVOICE-001
      x-rtk-requirement-ids:
      - REQ-AM-INVOICE-LIFECYCLE-001
      - REQ-AM-INVOICE-ARITHMETIC-001
  /v1/internal/billing/periods/close:
    post:
      tags:
      - Internal Billing
      summary: Close, price, issue, settle, and render one billing period
      operationId: closeBillingPeriod
      security:
      - billingInternalAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Existing or newly closed invoice result.
        '422':
          $ref: '#/components/responses/Error'
      x-rtk-feature-id: FEAT-AM-INVOICE-001
      x-rtk-requirement-ids:
      - REQ-AM-INVOICE-LIFECYCLE-001
      - REQ-AM-INVOICE-ARITHMETIC-001
  /v1/orgs/{orgId}/billing/summary:
    parameters:
    - $ref: '#/components/parameters/OwnershipVersion'
    get:
      tags:
      - Billing and Payments
      summary: Return tenant balance current cost runway and top-up health
      description: Current sole-owner access only. The current period starts at the later of the calendar-month boundary and the current responsibility-period boundary. Usage, totals and forecasts use only authorized period inputs; the shared cloud balance does not authorize predecessor history.
      operationId: getBillingSummary
      security:
      - billingServiceAuth: []
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Tenant billing summary.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  forecast:
                    $ref: '#/components/schemas/BillingForecast'
        '403':
          $ref: '#/components/responses/Error'
      x-rtk-feature-id: FEAT-AM-INVOICE-001
      x-rtk-requirement-ids:
      - REQ-AM-BILLING-SUMMARY-001
  /v1/orgs/{orgId}/billing/usage:
    parameters:
    - $ref: '#/components/parameters/OwnershipVersion'
    get:
      tags:
      - Billing and Payments
      summary: Return server-priced usage for the active billing period
      description: Explicit date ranges are filtered to the current caller's proven responsibility periods before pricing or aggregation. Unproven and cross-period usage windows are withheld, not prorated. A returning owner cannot read an intervening owner's usage.
      operationId: getBillingUsage
      security:
      - billingServiceAuth: []
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Priced usage lines.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  fact_count: { type: integer, minimum: 0 }
                  usage_through: { type: string, format: date-time, nullable: true }
        '403':
          $ref: '#/components/responses/Error'
      x-rtk-feature-id: FEAT-AM-INVOICE-001
      x-rtk-requirement-ids:
      - REQ-AM-BILLING-SUMMARY-001
  /v1/orgs/{orgId}/billing/invoices:
    parameters:
    - $ref: '#/components/parameters/OwnershipVersion'
    get:
      tags:
      - Billing and Payments
      summary: List tenant invoices with bounded filters
      description: Items and pagination totals use the same responsibility-period filter and snapshot. Only invoices whose recipient version and entire interval match a proven period of the current caller are visible; unknown or mixed-period invoices are withheld.
      operationId: listBillingInvoices
      security:
      - billingServiceAuth: []
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Invoice page.
        '403':
          $ref: '#/components/responses/Error'
      x-rtk-feature-id: FEAT-AM-INVOICE-001
      x-rtk-requirement-ids:
      - REQ-AM-INVOICE-LIFECYCLE-001
  /v1/orgs/{orgId}/billing/invoices/{invoiceId}:
    parameters:
    - $ref: '#/components/parameters/OwnershipVersion'
    get:
      tags:
      - Billing and Payments
      summary: Get one tenant invoice and settlement links
      description: Returns 404 for an invoice outside the current caller's proven responsibility periods, including predecessor and mixed-period invoices. Departed owners have no tenant access even to their historical invoices.
      operationId: getBillingInvoice
      security:
      - billingServiceAuth: []
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: invoiceId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Invoice detail.
        '404':
          $ref: '#/components/responses/Error'
      x-rtk-feature-id: FEAT-AM-INVOICE-001
      x-rtk-requirement-ids:
      - REQ-AM-INVOICE-LIFECYCLE-001
  /v1/orgs/{orgId}/billing/invoices/{invoiceId}/pdf:
    parameters:
    - $ref: '#/components/parameters/OwnershipVersion'
    get:
      tags:
      - Billing and Payments
      summary: Download an immutable issued invoice PDF
      description: Applies the same period authorization as invoice detail before reading document bytes. A known invoice UUID does not authorize a predecessor document.
      operationId: downloadBillingInvoicePdf
      security:
      - billingServiceAuth: []
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: invoiceId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Immutable invoice document
          content:
            application/pdf:
              schema:
                type: string
                format: binary
        '404':
          $ref: '#/components/responses/Error'
      x-rtk-feature-id: FEAT-AM-INVOICE-001
      x-rtk-requirement-ids:
      - REQ-AM-INVOICE-DOCUMENT-001
  /v1/orgs/{orgId}/billing/activity:
    parameters:
    - $ref: '#/components/parameters/OwnershipVersion'
    get:
      tags:
      - Billing and Payments
      summary: List normalized customer-safe billing activity
      description: Activity items, filtered totals and summary counts include only resources proven to belong to the current caller's responsibility periods. Unknown and predecessor resources are withheld; payment metadata is independently period-filtered.
      operationId: listBillingActivity
      security:
      - billingServiceAuth: []
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Billing activity page.
        '403':
          $ref: '#/components/responses/Error'
      x-rtk-feature-id: FEAT-AM-BILLING-ACTIVITY-001
      x-rtk-requirement-ids:
      - REQ-AM-BILLING-ACTIVITY-001
      - REQ-AM-BILLING-ACTIVITY-002
      - REQ-AM-BILLING-ACTIVITY-003
  /v1/orgs/{orgId}/billing/activity/{activityId}:
    parameters:
    - $ref: '#/components/parameters/OwnershipVersion'
    get:
      tags:
      - Billing and Payments
      summary: Get one customer-safe billing activity timeline
      description: Parent activity authorization and related timeline reads share an authorized snapshot. Predecessor or unproven resource IDs return 404.
      operationId: getBillingActivity
      security:
      - billingServiceAuth: []
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: activityId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Billing activity detail.
        '404':
          $ref: '#/components/responses/Error'
      x-rtk-feature-id: FEAT-AM-BILLING-ACTIVITY-001
      x-rtk-requirement-ids:
      - REQ-AM-BILLING-ACTIVITY-001
      - REQ-AM-BILLING-ACTIVITY-002
      - REQ-AM-BILLING-ACTIVITY-003
  /v1/orgs/{orgId}/billing/profile:
    parameters:
    - $ref: '#/components/parameters/OwnershipVersion'
    get:
      tags:
      - Billing and Payments
      summary: Get the prospective billing recipient profile
      description: After ownership handoff, the active profile is blank with requires_configuration=true and the new ownership_version. Historical recipient snapshots are not copied to the incoming owner. A configured profile is required before new invoice issuance.
      operationId: getBillingProfile
      security:
      - billingServiceAuth: []
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Billing profile.
          content:
            application/json:
              schema:
                type: object
                required: [billing_profile, profile]
                properties:
                  billing_profile:
                    $ref: '#/components/schemas/BillingProfile'
                  profile:
                    $ref: '#/components/schemas/BillingProfile'
      x-rtk-feature-id: FEAT-AM-INVOICE-001
      x-rtk-requirement-ids:
      - REQ-AM-BILLING-PROFILE-001
    put:
      tags:
      - Billing and Payments
      summary: Replace the prospective billing recipient profile
      description: A successful replacement configures the current owner's profile. Finalization increments the profile version, invalidating pre-handoff If-Match values; clients cannot restore an old recipient using a stale form.
      operationId: putBillingProfile
      security:
      - billingServiceAuth: []
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      - name: If-Match
        in: header
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Updated billing profile.
        '412':
          $ref: '#/components/responses/Error'
      x-rtk-feature-id: FEAT-AM-INVOICE-001
      x-rtk-requirement-ids:
      - REQ-AM-BILLING-PROFILE-001
  /v1/orgs/{orgId}/billing/statements:
    parameters:
    - $ref: '#/components/parameters/OwnershipVersion'
    get:
      tags:
      - Billing and Payments
      summary: Export tenant billing activity as UTF-8 CSV
      description: Exports invoice statement rows using the same responsibility-period visibility as invoice lists, including returning-owner and unknown-record exclusions. Export permission alone does not authorize predecessor records.
      operationId: exportBillingStatement
      security:
      - billingServiceAuth: []
      parameters:
      - name: orgId
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: CSV statement
          content:
            text/csv:
              schema:
                type: string
      x-rtk-feature-id: FEAT-AM-INVOICE-001
      x-rtk-requirement-ids:
      - REQ-AM-INVOICE-DOCUMENT-001
  /v1/orgs/{orgId}/billing/account:
    parameters:
    - $ref: '#/components/parameters/OwnershipVersion'
    get:
      tags:
      - Billing and Payments
      operationId: getBillingAccount
      x-rtk-feature-id: FEAT-AM-PAYMENT-001
      x-rtk-requirement-ids:
      - REQ-AM-BALANCE-LEDGER-001
      - REQ-AM-PAYMENT-AUTHZ-001
      security:
      - billingServiceAuth: []
      summary: Read the organization commercial account and automatic top-up summary.
      parameters:
      - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: Customer-safe commercial account.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingAccountResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/orgs/{orgId}/billing/ledger:
    parameters:
    - $ref: '#/components/parameters/OwnershipVersion'
    get:
      tags:
      - Billing and Payments
      operationId: listBillingLedger
      x-rtk-feature-id: FEAT-AM-PAYMENT-001
      x-rtk-requirement-ids:
      - REQ-AM-BALANCE-LEDGER-001
      - REQ-AM-PAYMENT-AUTHZ-001
      security:
      - billingServiceAuth: []
      summary: List immutable customer-safe balance ledger entries.
      description: Only entries with proven bindings to the current caller's responsibility periods are returned or counted. Invoice-linked entries also require the invoice's whole interval and recipient version to match that period. The confirmed opening balance does not expose its predecessor entries.
      parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Ledger page ordered newest first.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BillingLedgerResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /v1/orgs/{orgId}/payment-methods:
    parameters:
    - $ref: '#/components/parameters/OwnershipVersion'
    get:
      tags:
      - Billing and Payments
      operationId: listPaymentMethods
      x-rtk-feature-id: FEAT-AM-PAYMENT-001
      x-rtk-requirement-ids:
      - REQ-AM-PAYMENT-METHOD-001
      - REQ-AM-PAYMENT-AUTHZ-001
      security:
      - billingServiceAuth: []
      summary: List redacted organization payment methods.
      description: Redaction is not authorization. Only methods bound to the current caller's proven responsibility periods are visible. Previous-period methods remain revoked and cannot be reused or mutated, even after that owner returns.
      parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Offset'
      responses:
        '200':
          description: Payment method page without provider references or card credentials.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodsResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
  /v1/orgs/{orgId}/payment-methods/setup:
    parameters:
    - $ref: '#/components/parameters/OwnershipVersion'
    post:
      tags:
      - Billing and Payments
      operationId: setupPaymentMethod
      x-rtk-feature-id: FEAT-AM-PAYMENT-001
      x-rtk-requirement-ids:
      - REQ-AM-PAYMENT-METHOD-001
      - REQ-AM-PAYMENT-PROVIDER-001
      security:
      - billingServiceAuth: []
      summary: Request a provider-hosted payment method setup session.
      description: Consent, a pending method, and setup idempotency are persisted
        before provider I/O. The request never accepts PAN, CVV, expiry, or other
        card credentials. Non-production may use the isolated hosted simulator; external
        adapters remain capability-gated.
      parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMethodSetupRequest'
      responses:
        '202':
          description: Hosted setup session accepted by a qualified provider.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaymentMethodSetupResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '503':
          $ref: '#/components/responses/Error'
  /v1/orgs/{orgId}/payment-methods/{methodId}:
