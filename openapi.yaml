          $ref: '#/components/responses/Error'
  /v1/orgs/{orgId}/auto-topup:
    parameters:
    - $ref: '#/components/parameters/OwnershipVersion'
    get:
      tags:
      - Billing and Payments
      operationId: getAutoTopUpPolicy
      x-rtk-feature-id: FEAT-AM-PAYMENT-001
      x-rtk-requirement-ids:
      - REQ-AM-AUTO-TOPUP-001
      - REQ-AM-PAYMENT-AUTHZ-001
      security:
      - billingServiceAuth: []
      summary: Read the automatic top-up policy and Asia/Taipei safety-limit reset.
      description: Returns auto_topup=null when no current-period policy exists. A retained predecessor policy is not the successor's configuration and is not disclosed.
      parameters:
      - $ref: '#/components/parameters/OrgId'
      responses:
        '200':
          description: Policy response; auto_topup is null when no policy exists.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoTopUpResponse'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
    put:
      tags:
      - Billing and Payments
      operationId: replaceAutoTopUpPolicy
      x-rtk-feature-id: FEAT-AM-PAYMENT-001
      x-rtk-requirement-ids:
      - REQ-AM-AUTO-TOPUP-001
      - REQ-AM-PAYMENT-METHOD-001
      - REQ-AM-PAYMENT-AUDIT-001
      security:
      - billingServiceAuth: []
      summary: Replace the automatic top-up policy using optimistic concurrency and
        explicit consent.
      description: Requires the current owner's active current-period method and new consent. If-Match 0 creates a logical new configuration, including replacement of a proven revoked and disabled predecessor configuration. That predecessor snapshot is archived internally and generations remain monotonic. Existing current-period configuration requires its exact version; unknown legacy configuration is not automatically adopted.
      parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PutAutoTopUpRequest'
      responses:
        '200':
          description: Policy replaced with a new generation and version.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoTopUpResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
    delete:
      tags:
      - Billing and Payments
      operationId: disableAutoTopUpPolicy
      x-rtk-feature-id: FEAT-AM-PAYMENT-001
      x-rtk-requirement-ids:
      - REQ-AM-AUTO-TOPUP-001
      - REQ-AM-PAYMENT-AUDIT-001
      security:
      - billingServiceAuth: []
      summary: Disable automatic top-up and advance the policy generation.
      description: Requires a current-period policy. A retained predecessor policy returns 404 even if already disabled; this endpoint cannot reveal its settings.
      parameters:
      - $ref: '#/components/parameters/OrgId'
      - $ref: '#/components/parameters/IfMatchVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PaymentMutationReasonRequest'
      responses:
        '200':
          description: Disabled policy.
          headers:
            ETag:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoTopUpResponse'
        '400':
          $ref: '#/components/responses/Error'
        '401':
          $ref: '#/components/responses/Error'
        '403':
          $ref: '#/components/responses/Error'
        '404':
          $ref: '#/components/responses/Error'
        '409':
          $ref: '#/components/responses/Error'
        '428':
          $ref: '#/components/responses/Error'
