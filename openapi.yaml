      in: path
      required: true
      schema:
        type: string
        format: uuid
    get:
      operationId: getBillingAccess
      summary: Read the Billing-owned commercial access state
      security:
      - billingInternalAuth: []
      responses:
        '200':
          description: Current access state
          content:
            application/json:
              schema:
                type: object
                properties:
                  access:
                    type: object
                    required:
                    - organization_id
                    - state
                    - version
                    - updated_by
                    - created_at
                    - updated_at
                    properties:
                      organization_id:
                        type: string
                        format: uuid
                      state:
                        type: string
                        enum:
                        - active
                        - read_only
                        - suspended
                        - closed
                      reason_code:
                        type: string
                      version:
                        type: integer
                        minimum: 1
                      updated_by:
                        type: string
                      created_at:
                        type: string
                        format: date-time
                      updated_at:
                        type: string
                        format: date-time
                    additionalProperties: false
      x-rtk-feature-id: FEAT-BILL-SERVICE-001
      x-rtk-requirement-ids:
      - REQ-BILL-ACCESS-001
    put:
      operationId: putBillingAccess
      summary: Update commercial access using optimistic concurrency
      security:
      - billingInternalAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - state
              - version
              properties:
                state:
                  type: string
                  enum:
                  - active
                  - read_only
                  - suspended
                  - closed
                reason_code:
                  type: string
                version:
                  type: integer
                  minimum: 1
              additionalProperties: false
      responses:
        '200':
          description: Updated access state
        '409':
          description: Version conflict
      x-rtk-feature-id: FEAT-BILL-SERVICE-001
      x-rtk-requirement-ids:
      - REQ-BILL-ACCESS-001
components:
  securitySchemes:
    billingHandoffAuth:
      type: http
      scheme: bearer
      bearerFormat: handoff-coordinator-token
      description: Dedicated Account Manager durable coordinator credential. Distinct from tenant, pricing/access, debit and provider credentials. May relay authenticated participant confirmations and verified AM decisions, but cannot initialize responsibility, certify settlement or release holds. Routes are absent unless explicitly configured. Never expose this credential to a browser.
    billingServiceAuth:
      type: http
      scheme: bearer
      bearerFormat: service-token
      description: Dedicated Cloud Admin-to-Billing tenant API credential. Calls also require X-Billing-Actor-Type=user, a global Account Manager user ID in X-Billing-Actor-ID, X-Billing-Ownership-Version, X-Billing-Permissions, and X-Request-ID. Billing verifies the current sole owner and exact ownership version independently of permission headers. Platform privileges do not bypass this tenant boundary. The retired brand_cloud_user actor type is rejected; historical audit actors are not rewritten.
    billingInternalAuth:
      type: http
      scheme: bearer
      bearerFormat: internal-service-token
      description: Dedicated trusted usage, pricing, period-close, and access-control credential.
    billingDebitAuth:
      type: http
      scheme: bearer
      bearerFormat: debit-source-token
      description: Dedicated debit producer credential, distinct from tenant and other internal credentials.
  schemas:
    HandoffPrepareRequest:
      type: object
      additionalProperties: false
      required: [source_user_id, target_user_id, cutoff]
      properties:
        source_user_id: { type: string, format: uuid }
        target_user_id: { type: string, format: uuid }
        cutoff: { type: string, format: date-time }
    HandoffConfirmRequest:
      type: object
      additionalProperties: false
      required: [user_id, snapshot_version, balance_minor, currency]
      properties:
        user_id: { type: string, format: uuid, description: Global source or target authenticated by Account Manager. }
        snapshot_version: { type: integer, format: int64, minimum: 2 }
        balance_minor: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, enum: [TWD] }
    HandoffAuthorizeRequest:
      type: object
      additionalProperties: false
      required: [authorization_id, snapshot_version]
      properties:
        authorization_id: { type: string, format: uuid }
        snapshot_version: { type: integer, format: int64, minimum: 2 }
    HandoffFinalizeRequest:
      type: object
      additionalProperties: false
      required: [authorization_id, committed_owner_user_id, committed_ownership_version, committed_at, am_commit_sha256]
      properties:
        authorization_id: { type: string, format: uuid }
        committed_owner_user_id: { type: string, format: uuid }
        committed_ownership_version: { type: integer, format: int64, minimum: 2 }
        committed_at: { type: string, format: date-time }
        am_commit_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
    HandoffAbortRequest:
      type: object
      additionalProperties: false
      required: [cancellation_id, am_cancellation_sha256]
      properties:
        cancellation_id: { type: string, format: uuid }
        am_cancellation_sha256: { type: string, pattern: '^[0-9a-f]{64}$' }
        authorization_id: { type: string, format: uuid, description: Required if Billing already issued a commit grant. }
    HandoffScopeResponse:
      type: object
      required: [cloud_id, operation_id, ownership_version]
      properties:
        cloud_id: { type: string, format: uuid }
        operation_id: { type: string, format: uuid }
        ownership_version: { type: integer, format: int64, minimum: 1 }
    HandoffPreparedOperation:
      type: object
      required: [id, account_id, source_user_id, target_user_id, ownership_version, cutoff, phase, version, created_at]
      properties:
        id: { type: string, format: uuid }
        account_id: { type: string, format: uuid }
        source_user_id: { type: string, format: uuid }
        target_user_id: { type: string, format: uuid }
        ownership_version: { type: integer, minimum: 1 }
        cutoff: { type: string, format: date-time }
        phase: { type: string }
        version: { type: integer, minimum: 1 }
        created_at: { type: string, format: date-time }
    HandoffSettlement:
      type: object
      required: [operation_id, phase, blockers]
      properties:
        operation_id: { type: string, format: uuid }
        phase: { type: string }
        blockers: { type: array, items: { type: string } }
        snapshot:
          type: object
          required: [version, balance_minor, currency, cutoff, source_confirmed, target_confirmed]
          properties:
            version: { type: integer, format: int64, minimum: 2 }
            balance_minor: { type: integer, format: int64, minimum: 0 }
            currency: { type: string, enum: [TWD] }
            cutoff: { type: string, format: date-time }
            source_confirmed: { type: boolean }
            target_confirmed: { type: boolean }
    HandoffPrepareResponse:
      allOf:
        - { $ref: '#/components/schemas/HandoffScopeResponse' }
        - type: object
          required: [operation]
          properties:
            operation: { $ref: '#/components/schemas/HandoffPreparedOperation' }
    HandoffSettlementResponse:
      allOf:
        - { $ref: '#/components/schemas/HandoffScopeResponse' }
        - type: object
          required: [settlement]
          properties:
            settlement: { $ref: '#/components/schemas/HandoffSettlement' }
    HandoffAuthorizationResponse:
      allOf:
        - { $ref: '#/components/schemas/HandoffScopeResponse' }
        - type: object
          required: [authorization]
          properties:
            authorization:
              type: object
              required: [operation_id, authorization_id, snapshot_version, created_at]
              properties:
                operation_id: { type: string, format: uuid }
                authorization_id: { type: string, format: uuid }
                snapshot_version: { type: integer, format: int64, minimum: 2 }
                created_at: { type: string, format: date-time }
    HandoffProtocolResponse:
      allOf:
        - { $ref: '#/components/schemas/HandoffScopeResponse' }
        - type: object
          required: [operation]
          properties:
            operation:
              type: object
              required: [operation_id, phase]
              properties:
                operation_id: { type: string, format: uuid }
                phase: { type: string, enum: [abort_pending, aborted, finalized] }
    BillingProfile:
      type: object
      required: [legal_name, locale, timezone, delivery_preference, version, requires_configuration]
      properties:
        organization_id: {type: string, format: uuid, readOnly: true}
        ownership_version: {type: integer, minimum: 1, readOnly: true}
        requires_configuration:
          type: boolean
          readOnly: true
          description: True for an unset current-owner profile; invoice issuance is blocked until the owner supplies a replacement.
        legal_name: {type: string}
        tax_identifier: {type: string}
        billing_address: {type: string}
        contact_email: {type: string}
        locale: {type: string}
        timezone: {type: string}
        delivery_preference: {type: string, enum: [portal, portal_and_email]}
        version: {type: integer, minimum: 1, readOnly: true}
        created_at: {type: string, format: date-time, readOnly: true}
        updated_at: {type: string, format: date-time, readOnly: true}
    BillingForecast:
      type: object
      required: [state, observation_days, confidence, calculated_at]
      properties:
        state: { type: string, enum: [available, unavailable] }
        projected_period_total_minor: { type: integer, format: int64, nullable: true }
        projected_remaining_minor: { type: integer, format: int64, nullable: true }
        average_daily_cost_minor: { type: integer, format: int64, nullable: true }
        observation_days: { type: integer, minimum: 0 }
        usage_through: { type: string, format: date-time, nullable: true }
        confidence: { type: string, enum: [low, medium] }
        calculated_at: { type: string, format: date-time }
    PutAutoTopUpRequest:
      type: object
      additionalProperties: false
      required:
      - enabled
      - threshold_minor
      - top_up_amount_minor
      - currency
      - payment_method_id
      - daily_attempt_limit
      - daily_amount_limit_minor
      - cooldown_seconds
      - consent
      properties:
        enabled:
          type: boolean
        threshold_minor:
          $ref: '#/components/schemas/MoneyMinor'
        top_up_amount_minor:
          $ref: '#/components/schemas/MoneyMinor'
        currency:
          $ref: '#/components/schemas/Currency'
        payment_method_id:
          type: string
          format: uuid
        daily_attempt_limit:
          type: integer
          minimum: 1
          maximum: 10
        daily_amount_limit_minor:
          $ref: '#/components/schemas/MoneyMinor'
        cooldown_seconds:
          type: integer
          format: int64
          minimum: 300
        consent:
          $ref: '#/components/schemas/PaymentConsentAcceptance'
    RevokePaymentMethodResponse:
      type: object
      required:
      - payment_method
      - policy_disabled
      - duplicate
      properties:
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        policy_disabled:
          type: boolean
        duplicate:
          type: boolean
    PaymentSimulatorSetupCallback:
      type: object
      additionalProperties: false
      required:
      - account_id
      - setup_session_id
      - state
      - provider_code
      - hosted_url
      properties:
        account_id:
          type: string
          format: uuid
        setup_session_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - succeeded
          - failed
        provider_code:
          type: string
        hosted_url:
          type: string
          format: uri
        provider_customer_ref:
          type: string
        provider_method_ref:
          type: string
        card_brand:
          type: string
        last_four:
          type: string
          pattern: ^[0-9]{4}$
        expiry_month:
          type: integer
          minimum: 1
          maximum: 12
        expiry_year:
          type: integer
          minimum: 2000
          maximum: 9999
    PaymentIntentsResponse:
      type: object
      required:
      - payment_intents
      - pagination
      properties:
        payment_intents:
          type: array
          items:
            $ref: '#/components/schemas/PaymentIntent'
        pagination:
          $ref: '#/components/schemas/Pagination'
    ErrorResponse:
      type: object
      required:
      - error
      properties:
        error:
          type: object
          required:
          - code
          - message
          properties:
            code:
              type: string
            message:
              type: string
            retryable:
              type: boolean
              description: Optional machine-readable hint for Claim Token resolve
                failures.
            resolution_action:
              type: string
              description: Optional client action hint for Claim Token resolve failures.
    MoneyMinor:
      type: integer
      format: int64
      minimum: 1
      description: Currency-unit integer. For zero-decimal TWD, one amount_minor unit
        is NT$1.
    AutoTopUpResponse:
      type: object
      required:
      - auto_topup
      properties:
        auto_topup:
          allOf:
          - $ref: '#/components/schemas/AutoTopUpPolicy'
          nullable: true
    ManualTopUpResponse:
      type: object
      required:
      - payment_intent
      - duplicate
      properties:
        payment_intent:
          $ref: '#/components/schemas/PaymentIntent'
        duplicate:
          type: boolean
    HostedTopUpResponse:
      allOf:
      - $ref: '#/components/schemas/ManualTopUpResponse'
      - type: object
        required: [payment_action]
        properties:
          payment_action:
            type: object
            additionalProperties: false
            required: [method, url, fields]
            properties:
              method: { type: string, const: POST }
              url: { type: string, format: uri }
              fields:
                type: object
                additionalProperties: { type: string }
    InternalBillingDebitResponse:
      type: object
      required:
      - account_id
      - ledger_entry_id
      - balance_after_minor
      - currency
      - duplicate
      properties:
        account_id:
          type: string
          format: uuid
        ledger_entry_id:
          type: string
          format: uuid
        balance_after_minor:
          type: integer
          format: int64
        currency:
          $ref: '#/components/schemas/Currency'
        duplicate:
          type: boolean
        payment_intent_id:
          type: string
          format: uuid
          nullable: true
    PaymentConsentAcceptance:
      type: object
      additionalProperties: false
      required:
      - accepted
      - text_version
      - text_sha256
      - locale
      properties:
        accepted:
          type: boolean
          enum:
          - true
        text_version:
          type: string
          minLength: 1
          maxLength: 128
        text_sha256:
          type: string
          pattern: ^[0-9a-fA-F]{64}$
        locale:
          type: string
          minLength: 2
          maxLength: 35
    PaymentMethodSetupResponse:
      type: object
      required:
      - payment_method
      - hosted_url
      - duplicate
      properties:
        payment_method:
          $ref: '#/components/schemas/PaymentMethod'
        hosted_url:
          type: string
          format: uri
          description: Short-lived provider-hosted URL; never logged or stored in
            audit payloads.
        duplicate:
          type: boolean
    BillingLedgerResponse:
      type: object
      required:
      - ledger_entries
      - pagination
      properties:
        ledger_entries:
          type: array
          items:
            $ref: '#/components/schemas/BillingLedgerEntry'
        pagination:
          $ref: '#/components/schemas/Pagination'
    PaymentIntentDetailResponse:
      type: object
      required:
      - payment_intent
      - attempts
      properties:
        payment_intent:
          $ref: '#/components/schemas/PaymentIntent'
        attempts:
          type: array
          items:
            $ref: '#/components/schemas/PaymentAttempt'
    InternalBillingDebitRequest:
      type: object
      additionalProperties: false
      required:
      - organization_id
      - amount_minor
      - currency
      - reason
      - external_id
      properties:
        organization_id:
          type: string
          format: uuid
        amount_minor:
          $ref: '#/components/schemas/MoneyMinor'
        currency:
          $ref: '#/components/schemas/Currency'
        reason:
          type: string
          enum:
          - invoice_debit
          - usage_adjustment_debit
        external_id:
          type: string
          minLength: 1
          maxLength: 200
          description: Immutable invoice or usage-adjustment reference owned by the
            authenticated billing source.
    PaymentIntent:
      type: object
      description: Customer-safe normalized intent; provider order and transaction
        references are intentionally absent.
      required:
      - id
      - amount_minor
      - currency
      - reason
      - provider
      - payment_method_id
      - state
      - requires_customer_action
      - correlation_id
      - created_at
      - updated_at
      - completed_at
      properties:
        id:
          type: string
          format: uuid
        amount_minor:
          $ref: '#/components/schemas/MoneyMinor'
        currency:
          $ref: '#/components/schemas/Currency'
        reason:
          type: string
          enum:
          - manual_top_up
          - auto_top_up
        provider:
          type: string
        payment_method_id:
          type: string
          format: uuid
        state:
          type: string
          enum:
          - created
          - processing
          - authorized
          - requires_action
          - unknown
          - succeeded
          - failed
          - canceled
        requires_customer_action:
          type: boolean
        correlation_id:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
    ManualTopUpRequest:
      type: object
      additionalProperties: false
      required:
      - amount_minor
      - currency
      - payment_method_id
      properties:
        amount_minor:
          $ref: '#/components/schemas/MoneyMinor'
        currency:
          $ref: '#/components/schemas/Currency'
        payment_method_id:
          type: string
          format: uuid
    HostedTopUpRequest:
      type: object
      additionalProperties: false
      required: [amount_minor, currency, provider]
      properties:
        amount_minor: { $ref: '#/components/schemas/MoneyMinor' }
        currency: { $ref: '#/components/schemas/Currency' }
        provider: { type: string, pattern: '^[a-z0-9_]{1,32}$' }
    PaymentMethodSetupRequest:
      type: object
      additionalProperties: false
      required:
      - provider
      - consent
      properties:
        provider:
          type: string
          pattern: ^[a-z0-9_]{1,32}$
        consent:
          $ref: '#/components/schemas/PaymentConsentAcceptance'
      description: Card number, CVV/CVC, expiry, and magnetic-stripe data are forbidden.
    BillingAccountResponse:
      type: object
      required:
      - account
      - auto_topup
      - payment_providers
      properties:
        account:
          $ref: '#/components/schemas/CommercialAccount'
        auto_topup:
          allOf:
          - $ref: '#/components/schemas/AutoTopUpPolicy'
          nullable: true
        payment_providers:
          type: array
          items:
            $ref: '#/components/schemas/PaymentProviderSummary'
    PaymentMutationReasonRequest:
      type: object
      additionalProperties: false
      required:
      - reason
      properties:
        reason:
          type: string
          minLength: 3
          maxLength: 500
    PaymentAttempt:
      type: object
      required:
      - id
      - operation
      - attempt_number
      - started_at
      - completed_at
      - status
      - provider_code
      - next_reconciliation_at
      properties:
        id:
          type: string
          format: uuid
        operation:
          type: string
          enum:
          - setup
          - charge
          - query
          - cancel
          - refund
        attempt_number:
          type: integer
          minimum: 1
        started_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
          nullable: true
        status:
          type: string
          enum:
          - started
          - authorized
          - requires_action
          - unknown
          - succeeded
          - failed
          - canceled
        provider_code:
          type: string
        next_reconciliation_at:
          type: string
          format: date-time
          nullable: true
    AutoTopUpPolicy:
      type: object
      required:
      - id
      - enabled
      - threshold_minor
      - top_up_amount_minor
      - currency
      - payment_method_id
      - daily_attempt_limit
      - daily_amount_limit_minor
      - cooldown_seconds
      - generation
      - version
      - armed
      - consecutive_failure_count
      - limit_timezone
      - limit_reset_at
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        enabled:
          type: boolean
        threshold_minor:
          $ref: '#/components/schemas/MoneyMinor'
        top_up_amount_minor:
          $ref: '#/components/schemas/MoneyMinor'
        currency:
          $ref: '#/components/schemas/Currency'
        payment_method_id:
          type: string
          format: uuid
        daily_attempt_limit:
          type: integer
          minimum: 1
          maximum: 10
        daily_amount_limit_minor:
          $ref: '#/components/schemas/MoneyMinor'
        cooldown_seconds:
          type: integer
          format: int64
          minimum: 300
        generation:
          type: integer
          format: int64
          minimum: 1
        version:
          type: integer
          format: int64
          minimum: 1
        armed:
          type: boolean
        last_triggered_at:
          type: string
          format: date-time
          nullable: true
        last_succeeded_at:
          type: string
          format: date-time
          nullable: true
        consecutive_failure_count:
          type: integer
          minimum: 0
        limit_timezone:
          type: string
          enum:
          - Asia/Taipei
        limit_reset_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PaymentMethodsResponse:
      type: object
      required:
      - payment_methods
      - pagination
      properties:
        payment_methods:
          type: array
          items:
            $ref: '#/components/schemas/PaymentMethod'
        pagination:
          $ref: '#/components/schemas/Pagination'
    CommercialAccount:
      type: object
      required:
      - id
      - organization_id
      - currency
      - available_balance_minor
      - state
      - version
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        currency:
          $ref: '#/components/schemas/Currency'
        available_balance_minor:
          type: integer
          format: int64
        state:
          type: string
          enum:
          - active
          - attention_required
          - suspended
          - closed
        version:
          type: integer
          format: int64
          minimum: 0
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PaymentProviderSummary:
      type: object
      required:
      - name
      - environment
      - capabilities
      properties:
        name:
          type: string
          pattern: ^[a-z0-9_-]+$
        environment:
          type: string
          enum:
          - simulated
          - external
        capabilities:
          $ref: '#/components/schemas/PaymentProviderCapabilities'
    PaymentMethod:
      type: object
      description: Customer-safe display metadata. Provider customer/method references
        and card credentials are never returned.
      required:
      - id
      - account_id
      - provider
      - status
      - capabilities
      - consent_id
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        account_id:
          type: string
          format: uuid
        provider:
          type: string
        status:
          type: string
          enum:
          - pending
          - active
          - expired
          - revoked
          - failed
        card_brand:
          type: string
        last_four:
          type: string
          pattern: ^[0-9]{4}$
        expiry_month:
          type: integer
          minimum: 1
          maximum: 12
        expiry_year:
          type: integer
          minimum: 2000
          maximum: 9999
        capabilities:
          $ref: '#/components/schemas/PaymentProviderCapabilities'
        consent_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Pagination:
      type: object
      required:
      - limit
      - offset
      - total
      properties:
        limit:
          type: integer
        offset:
          type: integer
        total:
          type: integer
    BillingLedgerEntry:
      type: object
      required:
      - id
      - direction
      - amount_minor
      - currency
      - reason
      - balance_after_minor
      - created_at
      properties:
        id:
          type: string
          format: uuid
        direction:
          type: string
          enum:
          - credit
          - debit
        amount_minor:
          $ref: '#/components/schemas/MoneyMinor'
        currency:
          $ref: '#/components/schemas/Currency'
        reason:
          type: string
          enum:
          - invoice_debit
          - usage_adjustment_debit
          - manual_adjustment_debit
          - payment_top_up_credit
          - manual_adjustment_credit
          - refund_debit
          - chargeback_debit
        balance_after_minor:
          type: integer
          format: int64
        created_at:
          type: string
          format: date-time
    PaymentProviderCapabilities:
      type: object
      required:
      - hosted_setup
      - hosted_charge
      - vaulted_method
      - merchant_initiated_charge
      - status_query
      - webhook
      - refund
      - requires_customer_action
      properties:
        hosted_setup:
          type: boolean
        hosted_charge:
          type: boolean
        vaulted_method:
          type: boolean
        merchant_initiated_charge:
          type: boolean
        status_query:
          type: boolean
        webhook:
          type: boolean
        refund:
          type: boolean
        requires_customer_action:
          type: boolean
    Currency:
      type: string
      enum:
      - TWD
    PaymentWebhookResponse:
      type: object
      required:
      - accepted
      - duplicate
      properties:
        accepted:
          type: boolean
        duplicate:
          type: boolean
  parameters:
    HandoffOperationId:
      name: operationId
      in: path
      required: true
      schema: { type: string, format: uuid }
    HandoffOwnershipVersion:
      name: X-Billing-Ownership-Version
      in: header
      required: true
      description: Exact source ownership version of this persisted operation, including finalize and abort retries. Does not imply current tenant Billing authority.
      schema: { type: integer, format: int64, minimum: 1 }
    OwnershipVersion:
      name: X-Billing-Ownership-Version
      in: header
      required: true
      description: Exact current Account Manager ownership version. Billing independently checks the global actor against its proven sole-owner projection; permission or claimed role headers cannot substitute for ownership. Missing proof fails closed.
      schema:
        type: integer
        format: int64
        minimum: 1
    OrgId:
      name: orgId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    Offset:
      name: offset
      in: query
      required: false
      schema:
        type: integer
        default: 0
        minimum: 0
    Limit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        default: 50
        minimum: 1
        maximum: 200
    PaymentMethodId:
      name: methodId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    PaymentProvider:
      name: provider
      in: path
      required: true
      schema:
        type: string
        pattern: ^[a-z0-9_]{1,32}$
    IfMatchVersion:
      name: If-Match
      in: header
      required: true
      description: Quoted or unquoted numeric automatic top-up policy version; use
        0 to create the first policy.
      schema:
        type: string
        pattern: ^"?[0-9]+"?$
    PaymentIntentId:
      name: intentId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Stable client key used to safely replay a mutation.
      schema:
        type: string
        minLength: 1
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          examples:
            invalid_claim_token:
              summary: Non-retryable Claim Token error.
              value:
                error:
                  code: invalid_claim_token
                  message: Invalid claim token
                  retryable: false
                  resolution_action: scan_or_enter_a_valid_claim_token
            claim_service_unavailable:
              summary: Retryable Claim Token service error.
              value:
                error:
                  code: service_unavailable
                  message: Claim resolve is temporarily unavailable
                  retryable: true
                  resolution_action: retry_later
            oidc_user_not_provisioned:
              summary: Unknown SSO user.
              value:
                error:
                  code: user_not_provisioned
                  message: SSO user is not provisioned in account manager
            oidc_disabled:
              summary: OIDC login disabled.
              value:
                error:
                  code: oidc_disabled
                  message: OIDC authentication is disabled
            invalid_oidc_state:
              summary: Invalid or replayed OIDC state.
              value:
                error:
                  code: invalid_oidc_state
                  message: Invalid OIDC login state
            invalid_oidc_token:
              summary: Invalid OIDC token.
              value:
                error:
                  code: invalid_oidc_token
                  message: Invalid OIDC token
            unverified_oidc_email:
              summary: Unverified OIDC email.
              value:
                error:
                  code: unverified_oidc_email
                  message: OIDC email is not verified
            oidc_provider_misconfigured:
              summary: OIDC provider misconfigured.
              value:
                error:
                  code: oidc_provider_misconfigured
                  message: OIDC provider is misconfigured
