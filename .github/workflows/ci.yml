name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  contract-import:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v4
      - name: Prepare runner Python dependencies
        run: |
          python3 -c 'import sys; assert sys.version_info >= (3, 12), sys.version'
          python3 -m pip install \
            --disable-pip-version-check \
            --target "$RUNNER_TEMP/contract-import-python" \
            PyYAML==6.0.3
          echo "PYTHONPATH=$RUNNER_TEMP/contract-import-python" >> "$GITHUB_ENV"
      - run: python3 -m unittest discover -s scripts -p 'test_extract_openapi.py'
  test:
    runs-on: [self-hosted, Linux, X64]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing
          POSTGRES_DB: billing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billing -d billing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://billing:billing@127.0.0.1:5432/billing_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - run: go test ./...
