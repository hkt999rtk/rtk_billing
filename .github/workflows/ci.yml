name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: [self-hosted, Linux, X64]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: billing
          POSTGRES_PASSWORD: billing
          POSTGRES_DB: billing_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U billing -d billing_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgres://billing:billing@127.0.0.1:5432/billing_test?sslmode=disable
    steps:
      - uses: actions/checkout@v4
      - run: go test ./...
